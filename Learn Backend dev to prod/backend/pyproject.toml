[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.2.0",
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# alembic-generated code follows its own template conventions
exclude = ["migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# make `app` importable when the project itself isn't installed
pythonpath = ["."]
